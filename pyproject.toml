[project]
name = "ultimate-govee"
version = "0.1.0"
description = "Home Assistant integration for Govee devices over the cloud IoT and LAN transports"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "paho-mqtt>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "B008",   # Home Assistant uses function calls in argument defaults.
    "BLE001", # Device payload parsing deliberately degrades on any failure.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004", # Protocol constants are clearer as literals.
    "RUF001",  # Govee's documentation uses typographic characters.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["custom_components/ultimate_govee"]
